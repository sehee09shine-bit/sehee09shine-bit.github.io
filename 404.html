<script>
// 이전 나인하이어 채용 홈(yourunicorn.world 시절) 주소로 들어온 방문자를 현재 위치로 보낸다.
// 검색엔진에는 GitHub Pages가 404 상태를 그대로 돌려주므로 오래된 주소는 색인에서 빠진다.
(function () {
  var path = location.pathname.replace(/\/+$/, '').toLowerCase();
  var local = { '/faq': '/recruit/#faq', '/process': '/recruit/#journey', '/job_posting': '/recruit/#positions' };
  var article = /^\/(job_posting\/[^/]+|team_interview|positioninterview_[a-z0-9_]+|intern_interview|wg668o9t|prh39s0t|7oqvw16h|wylpicxe)$/;
  var target = local[path] || (article.test(path) ? 'https://article.yourunicorn.world' + location.pathname.replace(/\/+$/, '') + location.search : null);
  if (target) location.replace(target);
})();
</script><link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
